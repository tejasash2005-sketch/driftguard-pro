
name: DriftGuard CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      suite:
        description: "Choose the suite to run"
        required: true
        default: demo
        type: choice
        options:
          - demo
          - regression

permissions:
  contents: read

jobs:
  test:
    name: Tests and DriftGuard suite
    runs-on: ubuntu-latest

    env:
      TMPDIR: /tmp
      TMP: /tmp
      TEMP: /tmp

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run unit tests
        run: |
          python -m pytest -q --basetemp=/tmp/driftguard-pytest

      - name: Select DriftGuard suite
        id: suite
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          SELECTED_SUITE: ${{ inputs.suite || 'demo' }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            case "$SELECTED_SUITE" in
              demo|regression)
                echo "config=examples/${SELECTED_SUITE}.json" >> "$GITHUB_OUTPUT"
                ;;
              *)
                echo "Invalid suite: $SELECTED_SUITE"
                exit 2
                ;;
            esac
          else
            echo "config=examples/demo.json" >> "$GITHUB_OUTPUT"
          fi

      - name: Run DriftGuard suite
        run: |
          driftguard run "${{ steps.suite.outputs.config }}"
