```yaml
name: DriftGuard CI Gate

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      suite:
        description: "Choose the suite to test"
        required: true
        default: demo
        type: choice
        options:
          - demo
          - regression

jobs:
  driftguard:
    runs-on: ubuntu-latest
    env:
      TMPDIR: ${{ runner.temp }}/driftguard-tmp
      TMP: ${{ runner.temp }}/driftguard-tmp
      TEMP: ${{ runner.temp }}/driftguard-tmp

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prepare temporary directory
        run: mkdir -p "$TMPDIR"

      - name: Install DriftGuard and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"

      - name: Run unit tests
        run: python -m pytest --basetemp="$TMPDIR/pytest" -q

      - name: Select test suite
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          SUITE: ${{ inputs.suite || 'demo' }}
        run: |
          if [ "$EVENT_NAME" != "workflow_dispatch" ]; then
            SUITE="demo"
          fi

          if [ "$SUITE" = "demo" ]; then
            echo "CONFIG=examples/demo.json" >> "$GITHUB_ENV"
          elif [ "$SUITE" = "regression" ]; then
            echo "CONFIG=examples/regression.json" >> "$GITHUB_ENV"
          else
            echo "Unknown suite: $SUITE"
            exit 2
          fi

      - name: Run DriftGuard regression gate
        run: driftguard run "$CONFIG"
```