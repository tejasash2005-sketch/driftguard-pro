
name: DriftGuard CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      suite:
        description: Suite to run
        required: true
        type: choice
        options:
          - demo
          - regression

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      TMPDIR: ${{ runner.temp }}
      TMP: ${{ runner.temp }}
      TEMP: ${{ runner.temp }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest -q --basetemp="$TMPDIR/pytest"

      - name: Select suite
        id: suite
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "file=examples/${{ inputs.suite }}.json" >> "$GITHUB_OUTPUT"
          else
            echo "file=examples/demo.json" >> "$GITHUB_OUTPUT"
          fi

      - name: Run DriftGuard suite
        run: driftguard run "${{ steps.suite.outputs.file }}"
